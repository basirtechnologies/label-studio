---
test_name: csrf check
strict: false
marks:
- usefixtures:
  - django_live_url
  - enable_csrf
stages:
# Basir legacy patch: signup and login are csrf_exempt, so both succeed without a CSRF token.
# (Empty database: the first signup needs no invite token.)
- id: signup_csrf
  name: Sign up without csrf
  request:
    url: "{django_live_url}/user/signup?enforce_csrf_checks=1"
    data:
      email: test_suites_user@heartex.com
      password: 12345678
    method: POST
  response:
    status_code: 302

- id: login_csrf
  name: Login without csrf
  request:
    url: "{django_live_url}/user/login?enforce_csrf_checks=1"
    data:
      email: test_suites_user@heartex.com
      password: 12345678
    method: POST
  response:
    status_code: 302
    