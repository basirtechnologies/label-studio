name: "Docker images (GHCR)"

# Builds and pushes ready-to-run images to GitHub Container Registry:
#   ghcr.io/basirtechnologies/label-studio        - Label Studio app (Dockerfile)
#   ghcr.io/basirtechnologies/label-studio-nginx  - nginx front proxy (deploy/nginx/Dockerfile),
#                                                    built FROM the app image of the same commit
# Tags:
#   sha-<short sha>  every run
#   develop          pushes/runs on the develop branch
#   latest           pushes/runs on the main branch only

on:
  push:
    branches:
      - develop
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-images-${{ github.ref }}
  cancel-in-progress: false

env:
  APP_IMAGE: ghcr.io/basirtechnologies/label-studio
  NGINX_IMAGE: ghcr.io/basirtechnologies/label-studio-nginx
  PLATFORMS: linux/amd64

jobs:
  build-and-push:
    name: Build & push images
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Compute short SHA
        id: vars
        run: echo "short_sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3.11.1

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ---------------------------------------------------------------- app
      - name: App image metadata
        id: meta_app
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.APP_IMAGE }}
          flavor: |
            latest=false
          tags: |
            type=raw,value=sha-${{ steps.vars.outputs.short_sha }}
            type=raw,value=develop,enable=${{ github.ref == 'refs/heads/develop' }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build & push app image
        id: build_app
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          file: Dockerfile
          platforms: ${{ env.PLATFORMS }}
          push: true
          provenance: false
          tags: ${{ steps.meta_app.outputs.tags }}
          labels: ${{ steps.meta_app.outputs.labels }}
          cache-from: type=gha,scope=label-studio-app
          cache-to: type=gha,scope=label-studio-app,mode=max
          build-args: |
            COMMIT_SHA=${{ github.sha }}
            COMMIT_BRANCH=${{ github.ref_name }}

      # -------------------------------------------------------------- nginx
      - name: nginx image metadata
        id: meta_nginx
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.NGINX_IMAGE }}
          flavor: |
            latest=false
          tags: |
            type=raw,value=sha-${{ steps.vars.outputs.short_sha }}
            type=raw,value=develop,enable=${{ github.ref == 'refs/heads/develop' }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build & push nginx image
        id: build_nginx
        uses: docker/build-push-action@v7.4.0
        with:
          context: deploy/nginx
          file: deploy/nginx/Dockerfile
          platforms: ${{ env.PLATFORMS }}
          push: true
          provenance: false
          tags: ${{ steps.meta_nginx.outputs.tags }}
          labels: ${{ steps.meta_nginx.outputs.labels }}
          cache-from: type=gha,scope=label-studio-nginx
          cache-to: type=gha,scope=label-studio-nginx,mode=max
          build-args: |
            APP_IMAGE=${{ env.APP_IMAGE }}:sha-${{ steps.vars.outputs.short_sha }}

      - name: Summary
        env:
          APP_TAGS: ${{ steps.meta_app.outputs.tags }}
          NGINX_TAGS: ${{ steps.meta_nginx.outputs.tags }}
          APP_DIGEST: ${{ steps.build_app.outputs.digest }}
          NGINX_DIGEST: ${{ steps.build_nginx.outputs.digest }}
        run: |
          {
            echo "## Pushed images"
            echo
            echo "**App** (\`${APP_DIGEST}\`)"
            echo '```'
            echo "${APP_TAGS}"
            echo '```'
            echo "**nginx** (\`${NGINX_DIGEST}\`)"
            echo '```'
            echo "${NGINX_TAGS}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
